# .github/workflows/build_release_apk.yml

name: Build GitHub Nexus Release APK

# Push a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`) to trigger
# this workflow automatically. It can also be run manually from the Actions tab.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Needed so the workflow's default GITHUB_TOKEN can create a Release and
# upload assets without a personal access token.
permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Sign & Publish APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      # If the four signing secrets below are configured in
      # Settings -> Secrets and variables -> Actions, the APK is signed with
      # your real release key. Otherwise build.gradle falls back to debug
      # signing automatically, so the workflow never fails for lack of a key.
      - name: Decode release keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/github_nexus_release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=github_nexus_release.jks
          EOF

      - name: Build split-per-ABI release APKs
        run: |
          flutter build apk --release --split-per-abi \
            --obfuscate --split-debug-info=build/debug-symbols

      - name: Build universal release APK
        run: |
          flutter build apk --release \
            --obfuscate --split-debug-info=build/debug-symbols

      - name: Generate SHA-256 checksums
        working-directory: build/app/outputs/flutter-apk
        run: sha256sum *.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GitHub Nexus ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
