name: Build & Sign GitHub Nexus APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_universal:
        description: 'Also build a universal release APK alongside split-per-abi APKs'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  verify-and-build:
    name: Analyze, Test & Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static code analysis
        run: flutter analyze --no-fatal-infos

      - name: Run unit, widget & integration tests
        run: flutter test --reporter expanded

      - name: Decode Android Release Keystore (if configured in Secrets)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/github_nexus_release.jks
            printf "storePassword=%s
keyPassword=%s
keyAlias=%s
storeFile=github_nexus_release.jks
"               "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore configured from GitHub Secrets."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No release keystore secrets found; building with debug signing fallback."
          fi

      - name: Build Split-per-ABI Release APKs (smaller size per architecture)
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/debug-symbols

      - name: Build Universal Release APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_universal == true }}
        run: flutter build apk --release --obfuscate --split-debug-info=build/debug-symbols

      - name: Collect APKs & Generate SHA-256 Checksums
        run: |
          mkdir -p release_artifacts
          cp build/app/outputs/flutter-apk/*.apk release_artifacts/
          cd release_artifacts
          sha256sum *.apk > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: github-nexus-release-apks
          path: |
            release_artifacts/*.apk
            release_artifacts/SHA256SUMS.txt
          retention-days: 30

      - name: Upload Obfuscation Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: github-nexus-debug-symbols
          path: build/debug-symbols/
          retention-days: 30

      - name: Publish GitHub Release on Tag (v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release_artifacts/*.apk
            release_artifacts/SHA256SUMS.txt
